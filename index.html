<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖書館箱書預約系統</title>
    <!-- 引入 Microsoft Graph SDK -->
    <script src="https://alcdn.msauth.net/browser/2.38.1/js/msal-browser.min.js"></script>
    <style>
        :root {
            --primary: #4a6fa5;
            --primary-hover: #3b5984;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --status-ready: #2e7d32;
            --status-ready-bg: #e8f5e9;
            --status-reserved: #e65100;
            --status-reserved-bg: #fff3e0;
            --status-borrowed: #c62828;
            --status-borrowed-bg: #ffebee;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1050px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .role-section {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .role-badge {
            font-size: 0.9rem;
            padding: 6px 12px;
            background: #f0f0f0;
            border-radius: 20px;
            font-weight: 600;
        }

        button, .btn-link {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        button:hover, .btn-link:hover {
            background-color: var(--primary-hover);
        }

        .btn-opac {
            background-color: #7C2D12;
        }
        .btn-opac:hover {
            background-color: #4A3E3D;
        }

        .btn-checkout {
            background-color: #2e7d32;
        }
        .btn-checkout:hover {
            background-color: #1b5e20;
        }

        .btn-return {
            background-color: #e65100;
        }
        .btn-return:hover {
            background-color: #bf360c;
        }

        .btn-edit {
            background-color: #0288d1;
        }
        .btn-edit:hover {
            background-color: #01579b;
        }

        .btn-delete {
            background-color: #d32f2f;
        }
        .btn-delete:hover {
            background-color: #b71c1c;
        }

        .notice-panel {
            background-color: #FFF7ED;
            border-left: 5px solid #FFEAD5;
            border-radius: 6px;
            padding: 15px 20px;
            margin-bottom: 20px;
            color: #5d4037;
        }

        .notice-panel h3 {
            margin: 0 0 8px 0;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #e65100;
        }

        .notice-panel ol {
            margin: 0;
            padding-left: 20px;
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .panel {
            background-color: #f8f9fa;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .panel h2 {
            margin-top: 0;
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #444;
        }

        .form-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        input[type="text"], input[type="number"], select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            border-color: var(--primary);
        }

        .tag-filter-container {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tag-filter-title {
            font-weight: bold;
            font-size: 0.95rem;
            color: #555;
        }

        .tag-btn {
            background-color: #e9ecef;
            color: #495057;
            border: 1px solid #ced4da;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag-btn:hover {
            background-color: #dee2e6;
        }

        .tag-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .tag-badge {
            display: inline-block;
            background-color: #e2e8f0;
            color: #475569;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            margin-right: 4px;
            margin-bottom: 2px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f1f5f9;
            color: #334155;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
        }

        .status-ready { background-color: var(--status-ready-bg); color: var(--status-ready); }
        .status-reserved { background-color: var(--status-reserved-bg); color: var(--status-reserved); }
        .status-borrowed { background-color: var(--status-borrowed-bg); color: var(--status-borrowed); }

        .opac-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .opac-link:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }

        .staff-header-active {
            background-color: #fff8e1;
            border: 1px solid #ffe082;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            color: #b78103;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .page-info {
            font-size: 0.9rem;
            color: #666;
        }

        .page-buttons {
            display: flex;
            gap: 5px;
        }

        .page-btn {
            background-color: #ffffff;
            color: #333;
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .page-btn:hover {
            background-color: #f1f5f9;
        }

        .page-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .table-header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📚 圖書館箱書預約系統</h1>
            <div class="role-section">
               <div id="roleBadge" class="role-badge">當前身分：📖 班級預約模式</div>
                <a href="https://esa.ntpc.edu.tw/014579/library" target="_blank" class="btn-link btn-opac">館藏查詢</a>
                <button id="authBtn" onclick="toggleMode()">閱推老師登入</button>
            </div>
        </header>

        <div id="staffHeader" class="hidden">
            <span>⚙️ 閱推老師管理模式已啟用 (可進行箱書歸還、確認借出與後台編輯)</span>
        </div>

        <!-- 注意事項面板 -->
        <div class="notice-panel">
            <h3>預約與領取注意事項</h3>
            <ol>
                <li>為利箱書準備，<b>請至少提前一天辦理線上預約。</b></li>
                <li>完成線上預約後，請於<b>預約隔日起</b>至教務處洽<b>閱推老師</b>辦理正式借出與領取箱書。</li>
            </ol>
        </div>

        <!-- 標籤篩選列 -->
        <div class="tag-filter-container">
            <span class="tag-filter-title">🏷️ 標籤篩選：</span>
            <div id="tagFilterButtons" style="display: flex; flex-wrap: wrap; gap: 6px;"></div>
        </div>

        <!-- 班級預約面板 -->
        <div class="panel">
            <h2>📖 班級預約箱書</h2>
            <div class="form-group">
                <select id="selectBox" style="min-width: 250px;"></select>
                <input type="text" id="classInput" placeholder="請輸入班級 (例如: 801)" style="width: 180px;">
                <button onclick="reserveBox()">送出預約</button>
            </div>
        </div>

        <!-- 前台箱書清單表格 -->
        <div class="table-header-controls">
            <h2 style="margin: 0; font-size: 1.2rem; color: #444;">📦 箱書清單</h2>
            <div>
                <button onclick="syncFromExcel()" style="margin-right: 10px; background-color: #0288d1;">🔄 同步 Excel 資料</button>
                <label for="pageSizeSelect" style="font-size: 0.9rem; color: #666;">每頁顯示：</label>
                <select id="pageSizeSelect" onchange="changePageSize()">
                    <option value="10" selected>10 筆</option>
                    <option value="20">20 筆</option>
                    <option value="50">50 筆</option>
                </select>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 100px;">箱號</th>
                    <th>主題名稱</th>
                    <th>主題標籤</th>
                    <th style="width: 80px;">冊數</th>
                    <th style="width: 100px;">狀態</th>
                    <th style="width: 120px;">預約/借閱班級</th>
                    <th class="staff-col hidden" style="width: 150px;">管理操作</th>
                </tr>
            </thead>
            <tbody id="boxTableBody"></tbody>
        </table>

        <!-- 前台分頁器 -->
        <div class="pagination-container">
            <div id="pageInfo" class="page-info"></div>
            <div id="paginationButtons" class="page-buttons"></div>
        </div>

        <!-- 後台管理區塊 (閱推老師) -->
        <div id="staffPanel" class="panel hidden" style="margin-top: 40px; border-color: #ffe082; background-color: #fffde7;">
            <h2>🛠️ 閱推老師管理後台</h2>
            
            <h3 style="font-size: 1rem; margin-top: 0;">➕ 新增箱書 (同步至 Excel)</h3>
            <div class="form-group" style="margin-bottom: 25px;">
                <input type="text" id="newId" placeholder="箱號 (例: BOX-004)" style="width: 120px;">
                <input type="text" id="newTopic" placeholder="主題 (例: 歷史故事)" style="width: 200px;">
                <input type="text" id="newTags" placeholder="標籤 (請用半角逗號隔開, 例: 歷史,故事)" style="width: 250px;">
                <input type="number" id="newCount" placeholder="冊數" style="width: 80px;">
                <button onclick="addNewBox()">新增箱書</button>
            </div>

            <div class="table-header-controls">
                <h3 style="font-size: 1rem; margin: 0;">📋 管理清單 (支援編輯與刪除)</h3>
                <div>
                    <label for="mgmtPageSizeSelect" style="font-size: 0.85rem; color: #666;">後台每頁：</label>
                    <select id="mgmtPageSizeSelect" onchange="changeMgmtPageSize()">
                        <option value="10" selected>10 筆</option>
                        <option value="20">20 筆</option>
                    </select>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th style="width: 100px;">箱號</th>
                        <th>主題名稱</th>
                        <th>主題標籤</th>
                        <th style="width: 80px;">冊數</th>
                        <th style="width: 100px;">狀態</th>
                        <th style="width: 160px;">操作</th>
                    </tr>
                </thead>
                <tbody id="mgmtTableBody"></tbody>
            </table>

            <!-- 後台分頁器 -->
            <div class="pagination-container">
                <div id="mgmtPageInfo" class="page-info"></div>
                <div id="mgmtPaginationButtons" class="page-buttons"></div>
            </div>
        </div>
    </div>

    <script>
        const STAFF_PASSWORD = "0000"; // 閱推老師管理密碼
        let isStaff = false;

        // === 雲端同步 MSAL 與 Excel API 設定 ===
        const msalConfig = {
            auth: {
                clientId: "19dbf0e2-febd-4ea7-b7d0-157756f282c4",
                authority: "https://login.microsoftonline.com/235b689e-d0dd-49b5-bde9-34e94973fb41",
                redirectUri: window.location.origin + window.location.pathname
            }
        };
        const loginRequest = { scopes: ["Files.ReadWrite", "Files.ReadWrite.AppFolder"] };
        const myMSALObj = new msal.PublicClientApplication(msalConfig);

        const EXCEL_BASE_URL = "https://graph.microsoft.com/v1.0/me/drive/special/approot:/boxes_master.xlsx:/workbook/worksheets";
        const BOXES_TABLE_URL = `${EXCEL_BASE_URL}('Boxes')/tables('BoxesTable')`;
        const LOGS_TABLE_URL = `${EXCEL_BASE_URL}('Logs')/tables('LogsTable')`;

        // 預設預備資料 (若雲端載入失敗時備用)
        let boxes = [];

        // 前後台狀態控制
        let currentPage = 1;
        let pageSize = 10;
        let selectedTag = "ALL";
        let mgmtCurrentPage = 1;
        let mgmtPageSize = 10;

        // --- 取得 Access Token ---
        async function getAccessToken() {
            const accounts = myMSALObj.getAllAccounts();
            if (accounts.length > 0) {
                try {
                    const res = await myMSALObj.acquireTokenSilent({ ...loginRequest, account: accounts[0] });
                    return res.accessToken;
                } catch (e) {
                    const res = await myMSALObj.acquireTokenPopup(loginRequest);
                    return res.accessToken;
                }
            } else {
                const res = await myMSALObj.loginPopup(loginRequest);
                return res.accessToken;
            }
        }

        // --- 從 Excel 讀取資料 ---
        async function syncFromExcel() {
            try {
                const token = await getAccessToken();
                const res = await fetch(`${BOXES_TABLE_URL}/rows`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (!res.ok) throw new Error("Excel 讀取失敗");
                const data = await res.json();
                const rows = data.value || [];

                boxes = rows.map(r => {
                    const [id, topic, status, count, tagsStr, targetClass] = r.values[0];
                    return {
                        id: String(id || ""),
                        topic: String(topic || ""),
                        status: String(status || "可借閱"),
                        count: Number(count || 0),
                        tags: tagsStr ? String(tagsStr).split(",").map(t => t.trim()) : [],
                        targetClass: String(targetClass || "-")
                    };
                });

                saveBoxesLocal();
                renderUI();
            } catch (err) {
                console.error("雲端同步失敗:", err);
                loadBoxesFromStorage();
                renderUI();
            }
        }

        // --- 更新 Excel 箱書狀態 (PATCH) ---
        async function updateBoxInExcel(box) {
            try {
                const token = await getAccessToken();
                const res = await fetch(`${BOXES_TABLE_URL}/rows`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                if (!res.ok) throw new Error("取得資料失敗");
                const data = await res.json();
                const rows = data.value || [];

                const rowIndex = rows.findIndex(r => String(r.values[0][0]) === String(box.id));

                if (rowIndex !== -1) {
                    const tagsStr = (box.tags || []).join(",");
                    const updateUrl = `${BOXES_TABLE_URL}/rows/itemAt(index=${rowIndex})`;

                    await fetch(updateUrl, {
                        method: "PATCH",
                        headers: {
                            "Authorization": `Bearer ${token}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            values: [[box.id, box.topic, box.status, box.count, tagsStr, box.targetClass]]
                        })
                    });
                    console.log(`[Excel 同步成功] 箱號 ${box.id} 狀態已更新為：${box.status}`);
                }
            } catch (err) {
                console.error("更新 Excel 狀態失敗:", err);
            }
        }

        function loadBoxesFromStorage() {
            const saved = localStorage.getItem("library_boxes");
            if (saved) {
                try { boxes = JSON.parse(saved); } catch (e) { boxes = []; }
            }
        }

        function saveBoxesLocal() {
            localStorage.setItem("library_boxes", JSON.stringify(boxes));
        }

        function renderTagFilters() {
            const tagContainer = document.getElementById("tagFilterButtons");
            if (!tagContainer) return;

            const allTags = new Set();
            boxes.forEach(box => {
                if (box.tags && Array.isArray(box.tags)) {
                    box.tags.forEach(t => allTags.add(t));
                }
            });

            let html = `<button class="tag-btn ${selectedTag === 'ALL' ? 'active' : ''}" onclick="filterByTag('ALL')">全部 (ALL)</button>`;
            allTags.forEach(tag => {
                html += `<button class="tag-btn ${selectedTag === tag ? 'active' : ''}" onclick="filterByTag('${tag}')"># ${tag}</button>`;
            });
            tagContainer.innerHTML = html;
        }

        function filterByTag(tag) {
            selectedTag = tag;
            currentPage = 1;
            renderUI();
        }

        function changePageSize() {
            pageSize = parseInt(document.getElementById("pageSizeSelect").value) || 10;
            currentPage = 1;
            renderUI();
        }

        function changeMgmtPageSize() {
            mgmtPageSize = parseInt(document.getElementById("mgmtPageSizeSelect").value) || 10;
            mgmtCurrentPage = 1;
            renderUI();
        }

        function renderUI() {
            boxes.sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true, sensitivity: 'base' }));

            renderTagFilters();

            let filteredBoxes = boxes;
            if (selectedTag !== "ALL") {
                filteredBoxes = boxes.filter(box => box.tags && box.tags.includes(selectedTag));
            }

            const totalItems = filteredBoxes.length;
            const totalPages = Math.ceil(totalItems / pageSize) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const startIndex = (currentPage - 1) * pageSize;
            const pageBoxes = filteredBoxes.slice(startIndex, startIndex + pageSize);

            const tbody = document.getElementById("boxTableBody");
            const select = document.getElementById("selectBox");
            const staffHeader = document.getElementById("staffHeader");
            const mgmtTbody = document.getElementById("mgmtTableBody");

            if (tbody) tbody.innerHTML = "";
            if (select) select.innerHTML = "";
            if (mgmtTbody) mgmtTbody.innerHTML = "";

            if (staffHeader) {
                if (isStaff) {
                    staffHeader.classList.remove("hidden");
                    staffHeader.classList.add("staff-header-active");
                } else {
                    staffHeader.classList.add("hidden");
                    staffHeader.classList.remove("staff-header-active");
                }
            }

            document.querySelectorAll(".staff-col").forEach(el => {
                if (isStaff) el.classList.remove("hidden");
                else el.classList.add("hidden");
            });

            if (tbody) {
                pageBoxes.forEach(box => {
                    let statusClass = "status-ready";
                    if (box.status === "已預約") statusClass = "status-reserved";
                    if (box.status === "已借出") statusClass = "status-borrowed";

                    const topicWithLink = `<a href="box-detail.html?id=${box.id}" target="_blank" class="opac-link" title="查看與編輯 ${box.topic}">${box.topic} 🖼️</a>`;
                    const tagBadges = (box.tags || []).map(t => `<span class="tag-badge">#${t}</span>`).join("") || "-";

                    let staffActionBtn = "-";
                    if (isStaff) {
                        if (box.status === "已預約") {
                            staffActionBtn = `<button class="btn-checkout" onclick="confirmCheckout('${box.id}')">確實借出 (${box.targetClass})</button>`;
                        } else if (box.status === "已借出") {
                            staffActionBtn = `<button class="btn-return" onclick="returnBox('${box.id}')">辦理歸還</button>`;
                        }
                    }

                    tbody.innerHTML += `
                        <tr>
                            <td><b>${box.id}</b></td>
                            <td>${topicWithLink}</td>
                            <td>${tagBadges}</td>
                            <td>${box.count} 本</td>
                            <td><span class="status-badge ${statusClass}">${box.status}</span></td>
                            <td><b>${box.targetClass}</b></td>
                            <td class="staff-col ${isStaff ? '' : 'hidden'}">${staffActionBtn}</td>
                        </tr>
                    `;
                });
            }

            if (isStaff && mgmtTbody) {
                const mgmtTotalItems = boxes.length;
                const mgmtTotalPages = Math.ceil(mgmtTotalItems / mgmtPageSize) || 1;
                if (mgmtCurrentPage > mgmtTotalPages) mgmtCurrentPage = mgmtTotalPages;

                const mgmtStartIndex = (mgmtCurrentPage - 1) * mgmtPageSize;
                const mgmtPageBoxes = boxes.slice(mgmtStartIndex, mgmtStartIndex + mgmtPageSize);

                mgmtPageBoxes.forEach(box => {
                    let statusClass = "status-ready";
                    if (box.status === "已預約") statusClass = "status-reserved";
                    if (box.status === "已借出") statusClass = "status-borrowed";
                    const tagBadges = (box.tags || []).map(t => `<span class="tag-badge">#${t}</span>`).join("") || "-";

                    mgmtTbody.innerHTML += `
                        <tr>
                            <td><b>${box.id}</b></td>
                            <td>${box.topic}</td>
                            <td>${tagBadges}</td>
                            <td>${box.count} 本</td>
                            <td><span class="status-badge ${statusClass}">${box.status}</span></td>
                            <td>
                                <button class="btn-edit" onclick="editBox('${box.id}')">編輯資料</button>
                                <button class="btn-delete" onclick="deleteBox('${box.id}')">移除</button>
                            </td>
                        </tr>
                    `;
                });

                renderMgmtPagination(mgmtTotalItems, mgmtTotalPages);
            }

            if (select) {
                boxes.forEach(box => {
                    if (box.status === "可借閱") {
                        select.innerHTML += `<option value="${box.id}">${box.id} (${box.topic})</option>`;
                    }
                });

                if (select.innerHTML === "") {
                    select.innerHTML = `<option value="">-- 目前無可預約箱書 --</option>`;
                }
            }

            renderPagination(totalItems, totalPages);
        }

        function renderPagination(totalItems, totalPages) {
            const infoEl = document.getElementById("pageInfo");
            const btnContainer = document.getElementById("paginationButtons");
            if (!infoEl || !btnContainer) return;

            infoEl.innerText = `共 ${totalItems} 筆資料 | 第 ${currentPage} / ${totalPages} 頁`;
            btnContainer.innerHTML = "";

            const prevBtn = document.createElement("button");
            prevBtn.className = "page-btn";
            prevBtn.innerText = "◄ 上一頁";
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => { currentPage--; renderUI(); };
            btnContainer.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                const pBtn = document.createElement("button");
                pBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                pBtn.innerText = i;
                pBtn.onclick = () => { currentPage = i; renderUI(); };
                btnContainer.appendChild(pBtn);
            }

            const nextBtn = document.createElement("button");
            nextBtn.className = "page-btn";
            nextBtn.innerText = "下一頁 ►";
            nextBtn.disabled = currentPage === totalPages || totalPages === 0;
            nextBtn.onclick = () => { currentPage++; renderUI(); };
            btnContainer.appendChild(nextBtn);
        }

        function renderMgmtPagination(totalItems, totalPages) {
            const infoEl = document.getElementById("mgmtPageInfo");
            const btnContainer = document.getElementById("mgmtPaginationButtons");
            if (!infoEl || !btnContainer) return;

            infoEl.innerText = `共 ${totalItems} 筆資料 | 第 ${mgmtCurrentPage} / ${totalPages} 頁`;
            btnContainer.innerHTML = "";

            const prevBtn = document.createElement("button");
            prevBtn.className = "page-btn";
            prevBtn.innerText = "◄ 上一頁";
            prevBtn.disabled = mgmtCurrentPage === 1;
            prevBtn.onclick = () => { mgmtCurrentPage--; renderUI(); };
            btnContainer.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                const pBtn = document.createElement("button");
                pBtn.className = `page-btn ${i === mgmtCurrentPage ? 'active' : ''}`;
                pBtn.innerText = i;
                pBtn.onclick = () => { mgmtCurrentPage = i; renderUI(); };
                btnContainer.appendChild(pBtn);
            }

            const nextBtn = document.createElement("button");
            nextBtn.className = "page-btn";
            nextBtn.innerText = "下一頁 ►";
            nextBtn.disabled = mgmtCurrentPage === totalPages || totalPages === 0;
            nextBtn.onclick = () => { mgmtCurrentPage++; renderUI(); };
            btnContainer.appendChild(nextBtn);
        }

        // --- 預約箱書 (寫入 LogsTable + 更新 BoxesTable) ---
        async function reserveBox() {
            const boxId = document.getElementById("selectBox").value;
            const className = document.getElementById("classInput").value.trim();

            if (!boxId) { alert("目前沒有可預約的箱書！"); return; }
            if (!className) { alert("請輸入預約班級！"); return; }

            const targetBox = boxes.find(b => b.id === boxId);
            if (targetBox) {
                const fullClassName = className.includes("班") ? className : className + " 班";
                targetBox.status = "已預約";
                targetBox.targetClass = fullClassName;

                document.getElementById("classInput").value = "";
                saveBoxesLocal();
                renderUI();

                // 1. 同步 Logs 至 Excel
                try {
                    const token = await getAccessToken();
                    const timestamp = new Date().toLocaleString("zh-TW");
                    await fetch(`${LOGS_TABLE_URL}/rows/add`, {
                        method: "POST",
                        headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
                        body: JSON.stringify({ values: [[timestamp, boxId, fullClassName, "線上預約"]] })
                    });
                } catch (e) {
                    console.error("預約同步至 Logs 失敗:", e);
                }

                // 2. 更新 Excel BoxesTable 狀態
                await updateBoxInExcel(targetBox);

                alert(`【預約成功】\n\n${targetBox.targetClass} 已預約 ${targetBox.id}！隔日起可至教務處找閱推老師辦理正式借閱與領取！`);
            }
        }

        // --- 確認借出 (同步 Excel) ---
        async function confirmCheckout(boxId) {
            const targetBox = boxes.find(b => b.id === boxId);
            if (targetBox && confirm(`確認辦理借出嗎？`)) {
                targetBox.status = "已借出";
                saveBoxesLocal();
                renderUI();

                await updateBoxInExcel(targetBox);
            }
        }

        // --- 辦理歸還 (同步 Excel) ---
        async function returnBox(boxId) {
            const targetBox = boxes.find(b => b.id === boxId);
            if (targetBox && confirm(`確認辦理歸還嗎？`)) {
                targetBox.status = "可借閱";
                targetBox.targetClass = "-";
                saveBoxesLocal();
                renderUI();

                await updateBoxInExcel(targetBox);
            }
        }

        // --- 編輯箱書資料 (同步 Excel) ---
        async function editBox(boxId) {
            const targetBox = boxes.find(b => b.id === boxId);
            if (!targetBox) return;

            const newTopic = prompt(`請輸入 ${boxId} 的新主題：`, targetBox.topic);
            if (newTopic === null) return;
            const currentTagsStr = (targetBox.tags || []).join(",");
            const newTagsStr = prompt(`請輸入 ${boxId} 的標籤 (請用半角逗號分隔)：`, currentTagsStr);
            if (newTagsStr === null) return;
            const newCount = prompt(`請輸入 ${boxId} 的新冊數：`, targetBox.count);
            if (newCount === null) return;

            targetBox.topic = newTopic.trim();
            targetBox.tags = newTagsStr.split(",").map(t => t.trim()).filter(t => t !== "");
            targetBox.count = parseInt(newCount) || targetBox.count;

            saveBoxesLocal();
            renderUI();

            await updateBoxInExcel(targetBox);
        }

        // --- 刪除箱書 ---
        function deleteBox(boxId) {
            const targetBox = boxes.find(b => b.id === boxId);
            if (targetBox && confirm(`確定要刪除 ${boxId} 嗎？\n(注意：現有 Excel 表格列不會直接刪除，建議至 Excel 手動移除或清空)`)) {
                boxes = boxes.filter(b => b.id !== boxId);
                saveBoxesLocal();
                renderUI();
            }
        }

        function toggleMode() {
            if (!isStaff) {
                const password = prompt("請輸入閱推老師管理密碼： (預設 0000)");
                if (password === STAFF_PASSWORD) {
                    isStaff = true;
                    document.getElementById("roleBadge").innerHTML = "當前身分：<b style='color:#d35400;'>🛠️ 閱推老師管理模式</b>";
                    document.getElementById("authBtn").innerText = "登出管理模式";
                    document.getElementById("staffPanel").classList.remove("hidden");
                } else if (password !== null) { alert("密碼錯誤！"); }
            } else {
                isStaff = false;
                document.getElementById("roleBadge").innerHTML = "當前身分：<b>📖 班級預約模式</b>";
                document.getElementById("authBtn").innerText = "閱推老師登入";
                document.getElementById("staffPanel").classList.add("hidden");
            }
            renderUI();
        }

        // --- 新增箱書 (同步至 Excel BoxesTable) ---
        async function addNewBox() {
            const id = document.getElementById("newId").value.trim();
            const topic = document.getElementById("newTopic").value.trim();
            const tagsStr = document.getElementById("newTags").value.trim();
            const count = document.getElementById("newCount").value;

            if (!id || !topic || !count) { alert("請填寫完整！"); return; }
            if (boxes.some(b => b.id === id)) { alert("該箱號已存在！"); return; }

            const tagsArr = tagsStr ? tagsStr.split(",").map(t => t.trim()).filter(t => t !== "") : [];

            const newBox = { id: id, topic: topic, tags: tagsArr, count: parseInt(count), status: "可借閱", targetClass: "-" };
            boxes.push(newBox);
            
            document.getElementById("newId").value = "";
            document.getElementById("newTopic").value = "";
            document.getElementById("newTags").value = "";
            document.getElementById("newCount").value = "";

            saveBoxesLocal();
            renderUI();

            // 背景寫入 Excel
            try {
                const token = await getAccessToken();
                await fetch(`${BOXES_TABLE_URL}/rows/add`, {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        values: [[id, topic, "可借閱", Number(count), tagsStr, "-"]]
                    })
                });
                alert("新增成功！資料已寫入網頁與 Excel 雲端表格。");
            } catch (e) {
                console.error("寫入 Excel 失敗:", e);
                alert("網頁已新增成功，但寫入 Excel 雲端失敗，請重新同步。");
            }
        }

        // 頁面初始化
        window.addEventListener('load', async function () {
            await myMSALObj.initialize();
            await syncFromExcel();

            // 設定每 30 秒自動向 Excel 請求最新狀態 (跨 Client 輪詢)
            setInterval(() => {
                syncFromExcel();
            }, 30000);
        });
    </script>
</body>
